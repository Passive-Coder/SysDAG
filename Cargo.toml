[package]
name = "sysdag"
version = "1.0.0"
edition = "2021"
description = "Lightweight process anomaly detection via system-call dependency graphs and Weisfeiler–Lehman fingerprinting"
license = "MIT"
default-run = "sysdag"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
hex = "0.4"
ratatui = { version = "0.30", features = ["crossterm"] }
tachyonfx = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
unicode-normalization = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
aya = "0.14"
open = "5"

[profile.release]
lto = true
codegen-units = 1
